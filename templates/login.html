<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔐 EcoShop Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #0d47a1, #1a73e8, #4dabf7);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            min-height: 100vh;
            position: relative;
        }

        /* ===== BACKGROUND OVERLAY ===== */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('{{ url_for("static", filename="bg.jpg") }}') center/cover no-repeat;
            opacity: 0.15;
            z-index: 0;
        }

        .login-container {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(20px);
            padding: 40px 50px;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 420px;
            text-align: center;
            position: relative;
            z-index: 1;
            border: 1px solid rgba(255,255,255,0.2);
        }

        /* ===== LOGO ===== */
        .logo-container {
            margin-bottom: 8px;
        }

        .logo-text {
            font-size: 42px;
            font-weight: 900;
            color: #1a73e8;
            letter-spacing: 3px;
        }
        .logo-text span {
            color: #ff9800;
        }

        /* ===== SLOGAN ===== */
        .slogan {
            font-size: 16px;
            color: #1a73e8;
            font-weight: 600;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-top: -2px;
            font-style: italic;
        }
        .slogan::before {
            content: '"';
            color: #ff9800;
        }
        .slogan::after {
            content: '"';
            color: #ff9800;
        }

        .login-container .subtitle {
            text-align: center;
            color: #888;
            font-size: 14px;
            margin-bottom: 25px;
            font-weight: 500;
        }

        .form-group { margin-bottom: 20px; text-align: left; }
        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 5px;
            color: #333;
            font-size: 14px;
        }
        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 16px;
            transition: border 0.3s;
            background: #f8f9fa;
        }
        .form-group input:focus {
            border-color: #1a73e8;
            outline: none;
            background: white;
            box-shadow: 0 0 0 4px rgba(26,115,232,0.1);
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #1a73e8, #0d47a1);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(26,115,232,0.3);
        }
        .login-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(26,115,232,0.4);
        }

        .error-msg {
            background: #ffebee;
            color: #c62828;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: none;
            text-align: center;
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            color: #999;
            font-size: 12px;
        }
        .footer strong { color: #1a73e8; }

        .credentials-hint {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 13px;
            border: 1px solid #e0e0e0;
            text-align: left;
        }
        .credentials-hint .row {
            display: flex;
            justify-content: space-between;
            padding: 3px 0;
        }
        .credentials-hint strong { color: #1a73e8; }
        .admin-badge {
            background: #ff9800;
            color: white;
            padding: 0 8px;
            border-radius: 4px;
            font-size: 10px;
        }
        .staff-badge {
            background: #2196f3;
            color: white;
            padding: 0 8px;
            border-radius: 4px;
            font-size: 10px;
        }
    </style>
</head>
<body>
    <div class="login-container">

        <!-- ===== LOGO ===== -->
        <div class="logo-container">
            <div class="logo-text">ECO<span>SHOP</span></div>
            <!-- SLOGAN - Red Mark -->
            <div class="slogan">Smart Shop, Simple Life</div>
        </div>

        <p class="subtitle">Super Shop Management System</p>

        <div class="credentials-hint">
            <div class="row">
                <span>🔐 <strong>ADMIN001</strong> <span class="admin-badge">Admin</span></span>
                <span>Password: <strong>admin123</strong></span>
            </div>
            <div class="row">
                <span>👤 <strong>EMP001</strong> <span class="staff-badge">Staff</span></span>
                <span>Password: <strong>staff123</strong></span>
            </div>
        </div>

        <div class="error-msg" id="error-msg">❌ Invalid credentials!</div>

        <form id="login-form">
            <div class="form-group">
                <label>👤 Employee ID</label>
                <input type="text" id="employee_id" placeholder="Enter Employee ID" required autofocus>
            </div>
            <div class="form-group">
                <label>🔑 Password</label>
                <input type="password" id="password" placeholder="Enter Password" required>
            </div>
            <button type="submit" class="login-btn">🔓 Login</button>
        </form>

        <div class="footer">
            <p>EcoShop © 2026 | Developed by <strong>ZUBAIR</strong> 📞 +996 990 115 990</p>
        </div>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const employee_id = document.getElementById('employee_id').value.trim();
            const password = document.getElementById('password').value.trim();
            const errorMsg = document.getElementById('error-msg');

            if (!employee_id || !password) {
                errorMsg.textContent = '❌ Please fill all fields!';
                errorMsg.style.display = 'block';
                return;
            }

            fetch('/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: new URLSearchParams({ employee_id, password })
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success') {
                    window.location.href = '/';
                } else {
                    errorMsg.textContent = '❌ ' + data.message;
                    errorMsg.style.display = 'block';
                }
            })
            .catch(err => {
                errorMsg.textContent = '❌ Connection error!';
                errorMsg.style.display = 'block';
            });
        });
    </script>
</body>
</html>
