<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔐 EcoShop Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1a73e8, #0d47a1);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .login-container {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 400px;
        }
        .login-container h1 { text-align: center; color: #1a73e8; font-size: 32px; }
        .login-container .subtitle { text-align: center; color: #888; font-size: 14px; margin-bottom: 30px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 5px; color: #333; }
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }
        .form-group input:focus { border-color: #1a73e8; outline: none; }
        .login-btn {
            width: 100%;
            padding: 14px;
            background: #1a73e8;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }
        .login-btn:hover { background: #0d47a1; }
        .error-msg { background: #ffebee; color: #c62828; padding: 10px; border-radius: 8px; margin-bottom: 15px; display: none; text-align: center; }
        .footer { text-align: center; margin-top: 20px; color: #999; font-size: 12px; }
        .credentials-hint {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 13px;
            border: 1px solid #e0e0e0;
        }
        .credentials-hint .row { display: flex; justify-content: space-between; padding: 3px 0; }
        .credentials-hint strong { color: #1a73e8; }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>🏪 EcoShop</h1>
        <p class="subtitle">Super Shop Management System</p>
        
        <div class="credentials-hint">
            <div class="row"><span>🔐 Admin: <strong>ADMIN001</strong></span><span>Password: <strong>admin123</strong></span></div>
            <div class="row"><span>👤 Staff: <strong>EMP001</strong></span><span>Password: <strong>staff123</strong></span></div>
        </div>
        
        <div class="error-msg" id="error-msg">❌ Invalid credentials!</div>
        
        <form id="login-form">
            <div class="form-group">
                <label>👤 Employee ID</label>
                <input type="text" id="employee_id" placeholder="Enter Employee ID" required autofocus>
            </div>
            <div class="form-group">
                <label>🔑 Password</label>
                <input type="password" id="password" placeholder="Enter Password" required>
            </div>
            <button type="submit" class="login-btn">🔓 Login</button>
        </form>
        
        <div class="footer">
            <p>EcoShop © 2026 | Developed by Zubair 📞 +996 990 115 990</p>
        </div>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const employee_id = document.getElementById('employee_id').value.trim();
            const password = document.getElementById('password').value.trim();
            const errorMsg = document.getElementById('error-msg');
            
            if (!employee_id || !password) {
                errorMsg.textContent = '❌ Please fill all fields!';
                errorMsg.style.display = 'block';
                return;
            }
            
            fetch('/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: new URLSearchParams({ employee_id, password })
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success') {
                    window.location.href = '/';
                } else {
                    errorMsg.textContent = '❌ ' + data.message;
                    errorMsg.style.display = 'block';
                }
            })
            .catch(err => {
                errorMsg.textContent = '❌ Connection error!';
                errorMsg.style.display = 'block';
            });
        });
    </script>
</body>
</html>
